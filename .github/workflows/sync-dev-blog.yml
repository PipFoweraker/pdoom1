name: Sync Dev Blog to Website

on:
  push:
    paths:
      - 'dev-blog/entries/**'
      - 'dev-blog/index.json'
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync all entries'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync-dev-blog:
    runs-on: ubuntu-latest
    if: github.repository == 'PipFoweraker/pdoom1'

    steps:
      - name: Checkout pdoom1 repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Need previous commit for diff

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate blog entries
        run: |
          echo "Validating blog entries before sync..."
          python dev-blog/generate_index.py
          if [ $? -ne 0 ]; then
            echo "ERROR Blog validation failed. Fix errors before syncing."
            exit 1
          fi
          echo "SUCCESS Blog entries validated successfully"

      - name: Checkout website repository
        uses: actions/checkout@v7
        with:
          repository: PipFoweraker/pdoom1-website
          token: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          path: website
          ref: main

      - name: Determine changed files
        id: changes
        run: |
          if [ "${{ inputs.force_sync }}" == "true" ]; then
            echo "REFRESH Force sync requested - syncing all entries"
            echo "changed_files=$(find dev-blog/entries -name '*.md' | tr '\n' ' ')" >> $GITHUB_OUTPUT
          else
            echo "SEARCH Detecting changed blog entries..."
            changed_files=$(git diff --name-only HEAD~1 HEAD | grep '^dev-blog/entries/.*\.md$' | tr '\n' ' ')
            echo "changed_files=$changed_files" >> $GITHUB_OUTPUT
            if [ -z "$changed_files" ]; then
              echo "INFO No blog entry changes detected"
            else
              echo "MEMO Changed entries: $changed_files"
            fi
          fi

      - name: Sync blog entries to website
        if: steps.changes.outputs.changed_files != ''
        env:
          # SECURITY: filenames from git diff are author-controlled text --
          # pass via env (data), never inline ${{ }} in the script
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
        run: |
          echo "LAUNCH Syncing blog entries to website..."

          # Ensure blog directory exists
          mkdir -p website/public/blog
          mkdir -p website/public/dev-notes

          # Copy changed entries (word-splitting on spaces is intended)
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "DOCUMENT Copying $filename to website"
              cp "$file" "website/public/blog/"
            fi
          done

          # DO NOT copy dev-blog/index.json over the website's index.
          #
          # It used to, and on 2026-08-22 -- the first time this workflow ever
          # succeeded -- that destroyed the live blog index. The two files are
          # different artifacts that happen to share a name:
          #
          #   pdoom1  dev-blog/index.json         key "entries", fields nested
          #                                       under "frontmatter", covers
          #                                       dev-blog/entries/ only
          #   website public/blog/index.json      key "posts", flat fields,
          #                                       covers EVERY post in the
          #                                       website repo, and is generated
          #                                       by that repo's own
          #                                       scripts/build-blog-index.py
          #
          # public/blog/index.html reads data.posts. Handed an "entries"-shaped
          # file it renders nothing, and the five 2026 posts that live only in
          # the website repo were de-listed. Restored in pdoom1-website
          # aac31292; see pdoom1 issue #1260.
          #
          # This repo CANNOT produce a correct index for the website, because it
          # cannot see the website's posts. The website derives its own index
          # from front matter -- "editing index.json by hand is no longer a
          # thing" (build-blog-index.py) -- and its generate-feeds.yml runs
          # `build-blog-index.py --check` on any change to public/blog/, so a
          # synced .md is picked up by the repo that owns the index.
          #
          # Sync CONTENT, never a derived index.
          echo "CLIPBOARD Index NOT copied -- the website generates its own (issue #1260)"
          # Future: Create website-specific navigation from index.json

      - name: Commit and push to website
        if: steps.changes.outputs.changed_files != ''
        working-directory: website
        run: |
          git config user.name "Dev Blog Sync Bot"
          git config user.email "dev+blog-sync@pdoom.net"

          # Add all blog changes
          git add public/blog/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "INFO No changes to commit"
          else
            # Create meaningful commit message
            commit_msg="Auto-sync: Dev blog update from pdoom1"
            if [ "${{ inputs.force_sync }}" == "true" ]; then
              commit_msg="$commit_msg (force sync)"
            fi

            echo "SAVE Committing changes: $commit_msg"
            git commit -m "$commit_msg"

            echo "LAUNCH Pushing to website repository"
            git push

            echo "SUCCESS Blog sync completed successfully"
          fi

      - name: Notification
        if: steps.changes.outputs.changed_files != ''
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
        run: |
          echo "CELEBRATION Dev blog sync completed!"
          echo "METRICS Synced entries: $CHANGED_FILES"
          echo "GLOBAL Changes will be live on the website shortly"

      - name: No changes notification
        if: steps.changes.outputs.changed_files == ''
        run: |
          echo "INFO No blog entry changes detected - nothing to sync"
