name: Documentation Sync

on:
  push:
    branches: [main]
    paths:
      - 'godot/scripts/core/game_state.gd'
      - 'godot/scripts/core/actions.gd'
      - 'godot/scripts/core/events.gd'
      - 'docs/mechanics/**'
      - 'scripts/generate_mechanics_docs.py'
      - 'scripts/sync_website_docs.py'
  pull_request:
    branches: [main]
    paths:
      - 'godot/scripts/core/game_state.gd'
      - 'godot/scripts/core/actions.gd'
      - 'godot/scripts/core/events.gd'
      - 'docs/mechanics/**'
      - 'scripts/generate_mechanics_docs.py'
      - 'scripts/sync_website_docs.py'
  workflow_dispatch:

jobs:
  check-docs-sync:
    name: Check Documentation Sync
    runs-on: ubuntu-latest

    # Read-only on purpose. This job only reads the tree and uploads an
    # artifact. NOTE a latent gap, deliberately NOT closed here: the
    # "Auto-commit updated docs (main branch only)" step below ends in
    # `git push`, which needs `contents: write`. It has never yet fired --
    # every main run so far found the docs already in sync -- so it has never
    # been observed either working or 403ing. Granting push-to-main rights on
    # the strength of a step nobody has seen run is a bigger decision than the
    # comment-permission repair this file is being changed for (issue #1279);
    # whoever makes that call should do it knowingly, not inherit it.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check if mechanics docs are in sync
        id: check_sync
        run: |
          python scripts/generate_mechanics_docs.py --check
        continue-on-error: true

      - name: Update mechanics docs if out of sync
        if: steps.check_sync.outcome == 'failure'
        run: |
          python scripts/generate_mechanics_docs.py

      - name: Sync docs to website export format
        run: |
          python scripts/sync_website_docs.py

      - name: Check for uncommitted changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain docs/mechanics/) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Documentation is out of sync!"
            git diff docs/mechanics/
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Documentation is in sync"
          fi

      - name: Fail if docs are out of sync (PR only)
        if: github.event_name == 'pull_request' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "ERROR: Mechanics documentation is out of sync with game code!"
          echo "Please run: python scripts/generate_mechanics_docs.py"
          echo "Then commit the updated docs/mechanics/ files."
          exit 1

      - name: Auto-commit updated docs (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/mechanics/
          git commit -m "docs: Auto-update mechanics documentation from game code changes"
          git push

      - name: Upload website export artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-docs-export
          path: _website_export/
          retention-days: 30

  comment-pr:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: check-docs-sync
    if: github.event_name == 'pull_request' && always()

    # PERMISSIONS ARE REQUIRED AND WERE ABSENT UNTIL 2026-08-24 (issue #1279).
    # Without them the job inherits the repo default read-only GITHUB_TOKEN --
    # run 32569928505 logged it as exactly "Contents: read / Metadata: read /
    # Packages: read" -- and the createComment call below 403s with
    # "Resource not accessible by integration" on
    # POST /repos/PipFoweraker/pdoom1/issues/<pr>/comments.
    # Measured before the fix, over this workflow's ENTIRE run history (127
    # runs, 2025-12-07 to 2026-08-22): 77 of 77 pull_request runs FAILED and
    # 50 of 50 push-to-main runs PASSED. It has never once passed on a PR.
    # Main never fails because this job is gated on
    # `github.event_name == 'pull_request'` and so never runs there.
    # The 403 is confirmed in the log of every failed run whose log still
    # exists (2026-06-27 through 2026-08-22); older logs are 410 Gone.
    # A gate that reds on something it does not gate is worse than no gate: it
    # trains the reader to discount reds, which is how a real one gets waved
    # through. Same defect, same shape, as release-reminder.yml (2026-08-08).
    # The ruling that governs this block. It has to sit on one line because
    # the rulings generator matches per-line; do not reflow it. (Naming that
    # generator's path here would make the generated dev-tools index list this
    # workflow as one of its callers, which would be false -- see docs/TOOLS.md.)
    # The same hazard bit for real on 2026-08-29. This ruling's `mechanism:` used
    # to name the chronic-red checker BY PATH as a thing issue #1279 still owed,
    # and on the day that tool was actually written, docs/TOOLS.md began listing
    # docs-sync.yml among its CI callers -- which it is not. The mechanism now
    # names the workflow that really runs it and carries no tools/ path at all.
    # Nor does this comment, deliberately: writing the path here to explain the
    # problem reproduced the problem, once, before it was reworded to this.
    # RULING: 2026-08-22 -- a check that fails 100% of the time is not a check; chronic red trains the team to ignore red, so a permanently-failing gate must be either fixed or explicitly declared, never left standing -- flavour: ci-gates -- mechanism: the chronic-red census in guards.yml, which gates on this since 2026-08-29 (issue #1279)
    #
    # `pull-requests: write` and not `issues: write`: the endpoint is the
    # shared issue-comments endpoint, but this job runs ONLY on
    # `pull_request`, so `context.issue.number` is always a PR number and the
    # resource GitHub authorises is the pull request. Least privilege is
    # therefore the PR scope; `issues: write` would additionally grant writes
    # to every real issue in the repo, which nothing here needs.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download website export
        uses: actions/download-artifact@v8
        with:
          name: website-docs-export

      - name: Comment PR with preview info
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));

            const comment = `## [DOCS] Documentation Preview

            Mechanics docs have been exported for website preview:

            **Files exported:**
            ${manifest.files.map(f => `- \`${f}\``).join('\n')}

            **Last updated:** ${manifest.updated}

            Download the artifact from this workflow run to preview the website export.
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
