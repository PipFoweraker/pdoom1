name: Release Reminder

# Triggered manually or when a release tag is pushed
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

# PERMISSIONS ARE REQUIRED AND WERE ABSENT UNTIL 2026-08-08.
# Without `issues: write` the checklist step 403s with
# "Resource not accessible by integration", the job goes RED, and the red is
# unrelated to the release it appears to gate. On v0.14.0 the release itself was
# clean -- all three platform zips at first pass, board taking live scores within
# the half hour -- and the run list still showed a failed check on the tag.
# A gate that reds on something it does not gate trains the reader to discount
# reds, which is how a real one gets waved through.
permissions:
  contents: read
  issues: write

jobs:
  release-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Post Release Checklist Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read the release checklist
            const checklist = fs.readFileSync('.github/RELEASE_CHECKLIST.md', 'utf8');

            // Get the tag name
            const tagName = context.ref.replace('refs/tags/', '');

            // Post as issue comment or create discussion
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release Checklist: ${tagName}`,
              body: `## LAUNCH Release Preparation for ${tagName}\n\n${checklist}\n\n---\n\n*This checklist was automatically created by the release-reminder workflow.*\n\nOnce all items are checked, close this issue.`,
              labels: ['release', 'checklist']
            });

      - name: Check Version Consistency
        run: |
          echo "Checking version consistency across files..."

          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag version: $TAG_VERSION"

          # Check project.godot
          GODOT_VERSION=$(grep 'config/version=' godot/project.godot | cut -d'"' -f2)
          echo "Godot version: $GODOT_VERSION"

          if [ "$TAG_VERSION" != "$GODOT_VERSION" ]; then
            echo "WARNING WARNING: Version mismatch!"
            echo "Tag: v$TAG_VERSION"
            echo "Godot: $GODOT_VERSION"
            exit 1
          else
            echo "SUCCESS Version consistency check passed"
          fi
        shell: bash
