name: Enhanced Release with Validation & Feeds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.10.2)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      skip_validation:
        description: 'Skip validation (emergency only!)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  validate-data:
    name: Validate Historical Data & Schemas
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.validate.outputs.status }}
      validation_hash: ${{ steps.validate.outputs.hash }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical data validation
        id: validate
        continue-on-error: true
        run: |
          echo "SEARCH Validating historical data..."
          python scripts/validate_historical_data.py --verbose > validation_report.txt 2>&1
          VALIDATION_EXIT=$?

          # Generate hash of all validated data
          find godot/data shared/data -type f -name "*.json" -exec cat {} \; | sha256sum | cut -d' ' -f1 > data_hash.txt
          DATA_HASH=$(cat data_hash.txt)

          echo "hash=$DATA_HASH" >> $GITHUB_OUTPUT

          if [ $VALIDATION_EXIT -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "SUCCESS Validation passed!"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "ERROR Validation failed!"
            cat validation_report.txt
          fi

          exit $VALIDATION_EXIT

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: |
            validation_report.txt
            data_hash.txt

      - name: Create triage issue on validation failure
        if: failure() && !inputs.skip_validation
        uses: actions/github-script@v7
        env:
          # SECURITY: user-influenced (dispatch input / tag name) -- must not
          # be templated into the script text; read via process.env as data
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('validation_report.txt', 'utf8');
            const version = process.env.RELEASE_VERSION;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[!] Data Validation Failed for Release ${version}`,
              body: `## Validation Failure

            The release pipeline has halted due to data validation errors.

            **Version:** ${version}
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Validation Report

            \`\`\`
            ${report.slice(0, 4000)}
            \`\`\`

            ### Next Steps

            1. Review the validation errors above
            2. Fix data issues in the \`data/\` directory
            3. Re-run validation locally: \`python scripts/validate_historical_data.py\`
            4. Push fixes and re-trigger release

            ### Emergency Override

            To skip validation (emergency releases only), use:
            \`\`\`
            skip_validation: true
            \`\`\`
            `,
              labels: ['triage', 'validation', 'ci/cd', 'release-blocker']
            });

  build-godot:
    name: Build Godot Game (All Platforms)
    runs-on: ubuntu-latest
    needs: validate-data
    if: needs.validate-data.outputs.validation_status == 'success' || inputs.skip_validation
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Pre-Build Validation
        run: |
          echo "SEARCH Running pre-build validation checks..."
          python scripts/pre_build_validation.py --godot "$(which godot)" --quick
          if [ $? -ne 0 ]; then
            echo "ERROR Pre-build validation failed!"
            echo "::error::Build validation checks did not pass. Review logs above."
            exit 1
          fi
          echo "SUCCESS All validation checks passed!"

      # Issue #1069: the exports are routed through tools/build_release.py
      # (one preset at a time, inside build_all_platforms.py), so CI inherits
      # the SAME discipline a local cut gets: rm -rf godot/.godot before each
      # export (defeats the stale .godot/exported cache that burned ~12 cycles
      # in v0.11.0), a unique freshness-marker file, and post-export PROOF the
      # marker landed inside the .pck/zip. If the marker is missing, the
      # platform build exits non-zero and its outputs are discarded.
      #
      # The three platform builds are SEQUENTIAL and MUST STAY sequential:
      # every build_release.py run deletes godot/.godot, so splitting this
      # into parallel matrix jobs sharing a workspace (or parallel processes)
      # would corrupt the import caches mid-export.
      #
      # Failure policy (ruled in #1069): Windows or Linux failing fails this
      # job -- nothing is packaged, nothing publishes. macOS is BEST-EFFORT
      # (issue #1071: the GodotSteam .framework loses its Versions/Current
      # symlink on non-mac checkouts, so its export can fail through no fault
      # of the tagged source): a macOS failure emits a warning annotation,
      # drops the macOS assets, and lets Windows/Linux publish -- then the
      # verify-release-urls alias check (PDoom.app.zip must answer 200) turns
      # the run RED. Loud, but not blocking.
      - name: Build all platforms (via tools/build_release.py, freshness-proven)
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="$RELEASE_VERSION"
          echo "Building P(Doom) $VERSION for all platforms..."
          python scripts/build_all_platforms.py --version "$VERSION" --godot-path "$(which godot)"

      # Required platform: an empty artifact here means the freshness-proven
      # build silently vanished -- fail loudly, never publish.
      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: build-windows
          path: builds/windows/${{ github.event.inputs.version || github.ref_name }}/
          if-no-files-found: error

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: build-linux
          path: builds/linux/${{ github.event.inputs.version || github.ref_name }}/
          if-no-files-found: error

      # Best-effort platform (issue #1071): the dir is empty when the macOS
      # export failed; warn and continue so Windows/Linux still publish.
      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: build-mac
          path: builds/mac/${{ github.event.inputs.version || github.ref_name }}/
          if-no-files-found: warn

  # Turn the macOS `if-no-files-found: warn` above from a warning INTO THE VOID
  # into a tracked, linkable fact (v0.14.3, 2026-08-24). v0.14.3 published with
  # no macOS asset: the upload warned, the job stayed green, nothing was filed,
  # and the release feed then advertised a macOS URL that 404s. Every release
  # from v0.13.1 to v0.14.2 had shipped a mac asset, so nothing downstream had
  # ever had to describe an absent platform.
  #
  # This job checks the DOWNLOADED FILES, not the upload step's verdict -- an
  # `if-no-files-found` outcome is evaluated once, discarded, and readable by
  # nothing afterwards. It emits build-status.json (schema
  # `pdoom.build_status/1.0`) into the release-feeds artefact, so pdoom1.com can
  # render "build coming -- <issue url>" instead of either lying about
  # availability or pointing people at an old release.
  #
  # LOUD BUT NOT BLOCKING, and the split is the whole design:
  #   - a MISSING best-effort build is NOT an error here. It produces a warning
  #     annotation, a job-summary table, a JSON field and a rolling labelled
  #     issue. Windows and Linux publish regardless (ruled in #1069/#1071).
  #     The run still goes RED afterwards via verify-release-urls' alias check,
  #     which is deliberately AFTER publication.
  #   - a failure OF THE REPORTER is an error, and reds this job. A reporter
  #     that 403s quietly is worse than no reporter: that is exactly how the
  #     v0.14.3 pre-release-checks failure filed nothing and stayed invisible.
  #   - to keep that red off the publication path, generate-feeds runs under
  #     `if: always()` and its download of this artefact is continue-on-error.
  #
  # RULING: 2026-08-24 -- a best-effort platform build that fails must be TRACKED, not merely warned about: the release still publishes for the platforms that built, and the absence becomes ONE rolling per-platform issue plus a machine-readable build-status.json field the website reads, so a download page says "build coming" with a link instead of advertising a URL that 404s or pointing at an older release -- flavour: silent-failure -- mechanism: scripts/check_platform_builds.py + scripts/report_missing_build_issue.py, run by the platform-build-status job below
  platform-build-status:
    name: Detect Missing Platform Builds
    runs-on: ubuntu-latest
    needs: [validate-data, build-godot]
    # PERMISSIONS ARE REQUIRED HERE AND MUST NOT BE TRIMMED TO `contents: read`.
    # Without `issues: write` the reporting step 403s with "Resource not
    # accessible by integration" and files NOTHING -- which is precisely what
    # happened to pre-release-checks.yml on the v0.14.3 tag: the check went RED
    # for a reason nobody could read, and the missing macOS build stayed
    # invisible until a human noticed the 404. Narrowing this block does not
    # make the failure go away, it makes it silent. (Same reasoning, same
    # wording style as release-reminder.yml.)
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: build-artifacts/

      # No pipes anywhere in this job. RULING 2026-08-24 (flavour ci-gates):
      # `$?` after a pipeline is the RIGHTMOST command's status, so `tool | tee`
      # discards the tool's verdict, and a `|| fallback` after a pipeline never
      # fires and manufactures a confident negative. The scripts write their own
      # $GITHUB_STEP_SUMMARY block for exactly this reason, so there is nothing
      # to tee.
      - name: Check which platform artefacts actually exist
        id: detect
        # Exits 1 only if a REQUIRED platform (Windows/Linux) is missing, which
        # cannot normally reach here (their uploads use if-no-files-found:
        # error). A missing macOS build exits 0 on purpose.
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p public/releases
          python scripts/check_platform_builds.py \
            --artifacts-dir build-artifacts \
            --version "$RELEASE_VERSION" \
            --run-url "$RUN_URL" \
            --output public/releases/build-status.json

      # BLOCKING (this job only): if the tracking issue cannot be filed or
      # updated, the missing build becomes invisible again and we are back to
      # v0.14.3. Downstream jobs use `if: always()`, so this red never withholds
      # the Windows/Linux release.
      - name: File or update the rolling per-platform tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/report_missing_build_issue.py \
            --status public/releases/build-status.json \
            --repo "${{ github.repository }}" \
            --run-url "$RUN_URL"

      - name: Upload build status for the feeds
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-status
          path: public/releases/build-status.json
          if-no-files-found: error

  generate-feeds:
    name: Generate Release Feeds & Metadata
    runs-on: ubuntu-latest
    needs: [validate-data, build-godot, platform-build-status]
    # `always()` on purpose: platform-build-status reds when the REPORTER fails,
    # and a reporting failure must never withhold a good Windows/Linux release.
    # The real gate is still build-godot -- if that did not succeed, nothing
    # publishes.
    if: always() && needs.build-godot.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for git tags

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fold build-status.json (with its tracking-issue URLs) into the SAME
      # artefact the website already consumes, rather than inventing a second
      # feed the site would have to learn about. It rides along into
      # `release-feeds`, which is both attached to the GitHub release and
      # deployed by deploy-feeds -- so the site gets it wherever it already
      # reads the feed.
      #
      # THIS NOW RUNS BEFORE THE GENERATOR, and the order is the point. #1307
      # emits this file from its own job, which already walked the artefact tree
      # and decided per platform whether a build exists. The feed generator
      # ADOPTS that verdict via --build-status instead of scanning the artefacts
      # a second time and forming its own opinion. Two scans of one artefact
      # tree is two answers waiting to disagree; the scanner is authoritative
      # and this is the wire that carries its answer.
      #
      # continue-on-error: a reporter failure must not cost us the feed. If the
      # file is absent the generator says so loudly and falls back to the
      # Releases API, and failing that reports every platform UNKNOWN -- it
      # never silently reverts to advertising all three.
      - name: Fold platform build status into the feed
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-build-status
          path: public/releases/

      # Why the generator needs telling at all (v0.14.3, 2026-08-24): macOS is a
      # best-effort platform. Its export failed on a Windows .ico Godot cannot
      # decode (#1305), build-mac uploaded nothing (`if-no-files-found: warn`,
      # correctly), Windows/Linux published -- and the generator, which knew
      # nothing about any of it, advertised PDoom-macOS-v0.14.3.zip from the
      # naming convention alone. Live 404 in a public feed. The build pipeline
      # had the answer the whole time; nothing carried it across the job
      # boundary. --build-status is that wire.
      - name: Generate release metadata
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="$RELEASE_VERSION"
          echo "MEMO Generating metadata for $VERSION..."
          python scripts/generate_release_metadata.py \
            --version "$VERSION" \
            --build-status public/releases/build-status.json

      - name: Upload metadata artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-feeds
          path: public/releases/

  create-release-manifest:
    name: Create Release Manifest
    runs-on: ubuntu-latest
    needs: [validate-data, build-godot, generate-feeds]
    outputs:
      manifest_hash: ${{ steps.manifest.outputs.hash }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The built zips, so the manifest can publish per-asset sha256 hashes.
      # These hashes are the integrity anchor the in-game updater verifies
      # against BEFORE trusting any downloaded blob (self-updater workstream;
      # docs/design/UPDATER_DESIGN.md). A manifest without them cannot ever
      # authorize an auto-install.
      - name: Download build artifacts for hashing
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: build-artifacts/

      # scripts/generate_release_manifest.py replaced the old inline YAML
      # heredoc: same fields plus ladder_version / highlights / download_page /
      # assets, and it is unit-tested (tests/test_generate_release_manifest.py)
      # where a heredoc could only be eyeballed. It fails LOUDLY (non-zero) on
      # a malformed version, missing ladder_version.txt, or non-ASCII output --
      # a bad manifest must fail the release, not ship.
      - name: Generate release manifest
        id: manifest
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          VALIDATION_STATUS: ${{ needs.validate-data.outputs.validation_status }}
        run: |
          if [ "$VALIDATION_STATUS" = "success" ]; then VALIDATED=true; else VALIDATED=false; fi
          python scripts/generate_release_manifest.py \
            --version "$RELEASE_VERSION" \
            --commit "${{ github.sha }}" \
            --repository "${{ github.repository }}" \
            --data-hash "${{ needs.validate-data.outputs.validation_hash }}" \
            --workflow-run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --ref "${{ github.ref }}" \
            --actor "${{ github.actor }}" \
            --event "${{ github.event_name }}" \
            --validation-passed "$VALIDATED" \
            --assets-dir build-artifacts \
            --output release_manifest.json

          # Generate manifest hash
          MANIFEST_HASH=$(sha256sum release_manifest.json | cut -d' ' -f1)
          echo "hash=$MANIFEST_HASH" >> $GITHUB_OUTPUT

          echo "CLIPBOARD Release Manifest:"
          cat release_manifest.json | jq .

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: release_manifest.json

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-data, build-godot, generate-feeds, create-release-manifest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Extract changelog
        id: changelog
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="$RELEASE_VERSION"
          VERSION_NUM="${VERSION#v}"

          # Extract changelog (simplified version)
          if grep -q "\[$VERSION_NUM\]" CHANGELOG.md; then
            sed -n "/\[$VERSION_NUM\]/,/^## /p" CHANGELOG.md | head -n -1 > release_notes.txt
          else
            echo "Release $VERSION" > release_notes.txt
            echo "" >> release_notes.txt
            echo "See CHANGELOG.md for details." >> release_notes.txt
          fi

          # Unsigned-build / SmartScreen notice. Kept as a checked-in file rather than
          # echo lines so the wording is reviewable, diffable, and reusable verbatim by
          # the website. A downloading player meets SmartScreen BEFORE they ever open
          # HOW-TO-RUN.txt inside the zip, so the release body has to carry it too.
          echo "" >> release_notes.txt
          cat tools/release_notes/RELEASE-BODY-security-notice.md >> release_notes.txt

          # Append manifest info
          echo "" >> release_notes.txt
          echo "## Build Information" >> release_notes.txt
          echo "" >> release_notes.txt
          echo "- **Commit:** \`${{ github.sha }}\`" >> release_notes.txt
          echo "- **Data Hash:** \`${{ needs.validate-data.outputs.validation_hash }}\`" >> release_notes.txt
          echo "- **Manifest Hash:** \`${{ needs.create-release-manifest.outputs.manifest_hash }}\`" >> release_notes.txt
          echo "- **Engine:** Godot 4.5.1" >> release_notes.txt

      # The release BODY is what reaches players -- pdoom1.com's /game-changelog/
      # renders release bodies live from the releases API, with no human in
      # between. v0.13.2 shipped a body announcing the Research Quality System as
      # delivered while #500 was open. A pre-commit hook on CHANGELOG.md would not
      # have caught it: the body is assembled HERE, at release time, by the sed
      # above, and the sed's start pattern is not even anchored to a heading.
      # So the gate checks release_notes.txt itself -- the exact bytes about to be
      # published -- and it must sit between assembly and publication. Blocking:
      # a false delivery claim fails the release rather than reaching readers.
      # Issue #1165.
      - name: Guard the release body against false delivery claims
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          python scripts/check_release_notes.py \
            --body release_notes.txt \
            --tag "$RELEASE_TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: P(Doom) ${{ github.event.inputs.version || github.ref_name }}
          body_path: release_notes.txt
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || contains(github.ref_name, '-') }}
          files: |
            build-windows/**/*.zip
            build-linux/**/*.zip
            build-mac/**/*.zip
            release-manifest/release_manifest.json
            release-feeds/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Anti-rot guard (issue #963): the generator has drifted from the real
  # build/upload pipeline before (PDoom.exe / PDoom.x86_64 were 404s against
  # every release since the versioned-zip pipeline landed) and nothing
  # caught it until a human noticed. Runs AFTER create-github-release so the
  # asset URLs actually exist to check. Blocking: a future generator/build
  # mismatch fails this job (and therefore the workflow run) instead of
  # silently shipping broken URLs.
  verify-release-urls:
    name: Verify Release Download URLs
    runs-on: ubuntu-latest
    needs: [create-github-release]
    if: needs.create-github-release.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download feed artifact
        uses: actions/download-artifact@v8
        with:
          name: release-feeds
          path: public/releases/

      - name: Verify this release's download URLs resolve
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          python scripts/verify_release_urls.py --file "public/releases/${RELEASE_VERSION}.json"

      # The step above only checks URLs the FEED lists, and the feed lists
      # versioned zips only. The website's download buttons are a second,
      # independent path: fixed strings against releases/latest/download/<name>.
      # That is exactly how #1068 hid -- the feed check passed green on every
      # release while the site's Linux button 404'd, because the unversioned
      # PDoom-Linux.zip alias was never published and never checked. Assert the
      # aliases exist ON THIS TAG (deterministic; `latest` may not have flipped
      # yet, and a prerelease never becomes Latest at all).
      - name: Verify the unversioned platform aliases were published
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          fail=0
          for asset in PDoom-Windows.zip PDoom-Linux.zip PDoom.app.zip; do
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_VERSION}/${asset}"
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
            echo "  $code  $url"
            if [ "$code" != "200" ]; then
              echo "::error::Unversioned alias asset missing: ${asset} (HTTP ${code}). The website download button for this platform will 404."
              fail=1
            fi
          done
          exit $fail

      - name: Sweep committed feed index for rotted entries (report-only)
        # Report-only on purpose: an OLD entry going 404 (e.g. a release that
        # was later deleted, like v0.9.0) is a separate, non-urgent cleanup
        # concern, not something that should block THIS release from
        # shipping. The step above is what's blocking for the new tag.
        continue-on-error: true
        run: |
          python scripts/verify_release_urls.py --sweep public/releases/releases.json

  # Explicitly drive the website version sync. Required because this workflow
  # publishes the release with GITHUB_TOKEN, and a release published by a
  # GITHUB_TOKEN-authored action does NOT fire the `release: published` event
  # that sync-game-version.yml otherwise listens on (GitHub loop-prevention).
  # workflow_call runs it in-line (no event, no suppression) and inherits
  # CROSS_REPO_TOKEN -- no new PAT, least privilege.
  sync-website-version:
    name: Sync Version to Website
    needs: create-github-release
    if: needs.create-github-release.result == 'success'
    uses: ./.github/workflows/sync-game-version.yml
    with:
      target_version: ${{ github.event.inputs.version || github.ref_name }}
    secrets: inherit

  deploy-feeds:
    name: Deploy Feeds to Website
    runs-on: ubuntu-latest
    needs: create-github-release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Download feed artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-feeds
          path: public/releases/

      - name: Deploy to GitHub Pages (or your hosting)
        run: |
          echo "LAUNCH Deploying feeds to website..."
          # TODO: Add your deployment logic here
          # Could use gh-pages, rsync to server, etc.
          ls -la public/releases/

  notification:
    name: Send Release Notifications
    runs-on: ubuntu-latest
    needs: create-github-release
    if: always()
    steps:
      - name: Release Success Notification
        if: needs.create-github-release.result == 'success'
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          echo "SUCCESS Release $RELEASE_VERSION published successfully!"
          # The line that used to sit here read, unconditionally:
          #   "Game builds created for Windows, Linux, and macOS"
          # DESIGN_2026-08-24_release_lanes.md counts that as the third of four
          # documents that asserted macOS shipped on v0.14.3 when it had not --
          # the same defect as the feed and the manifest, in an echo.
          #
          # It is DELETED rather than replaced with a derived list. This job
          # downloads no artefacts, so it would have to re-read or re-derive the
          # platform set to say anything true, and the honest options are a
          # heredoc (this workflow's manifest heredoc is exactly why
          # scripts/generate_release_manifest.py exists -- untestable and
          # silently fragile) or a fourth consumer of build-status.json for a
          # log line nobody acts on. The truth already ships in the feed, the
          # manifest and build-status.json, all three of which now agree. A
          # notification that repeats it adds no information and one more place
          # to drift.
          echo "Feeds generated and ready for website consumption"

      - name: Release Failure Notification
        if: needs.create-github-release.result == 'failure'
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          echo "ERROR Release $RELEASE_VERSION failed!"
          echo "Check the workflow logs for details"
