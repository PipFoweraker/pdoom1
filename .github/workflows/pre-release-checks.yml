name: Pre-Release Checks

# Run when creating a release tag or manually
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  pre-release-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history + tags: the #1165 guard ties each cited issue to a
          # commit in <previous tag>..<this tag>, which a shallow clone cannot see.
          fetch-depth: 0

      # Note: unit tests run on PRs via godot-tests.yml (GUT). Pre-release focuses
      # on release-readiness (changelog, version, clean tree). The former pygame-era
      # "cd python && pytest" step was removed (no python/ dir exists).

      # ANCHORED ON PURPOSE (2026-08-24). This was `grep -q "$TAG_VERSION"` --
      # unanchored and unbracketed, so ANY mention of the bare string anywhere in
      # CHANGELOG.md's 1800+ lines satisfied it: a prose reference, a link, an issue
      # number that happened to contain the digits. It therefore printed
      # "SUCCESS CHANGELOG.md contains version X" for a release whose section did not
      # exist. Meanwhile the extractor that actually builds the published body
      # (enhanced-release.yml) greps `\[$VERSION_NUM\]`, and
      # generate_release_metadata.py anchors on `## [<version>]`. Three gates, three
      # different questions, and the loosest one owned the reassuring message.
      # This form asks the SAME question the extractor asks: is there a section
      # heading to extract? Note the dots in $TAG_VERSION are regex wildcards, which
      # the `^## \[` ... `\]` framing makes harmless.
      - name: Check CHANGELOG updated
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Checking if CHANGELOG.md has a section heading for version $TAG_VERSION..."

          if grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "SUCCESS CHANGELOG.md has a '## [$TAG_VERSION]' section"
          else
            echo "ERROR ERROR: CHANGELOG.md has no '## [$TAG_VERSION]' section heading"
            echo "A passing mention of $TAG_VERSION elsewhere in the file is NOT enough --"
            echo "the release body is extracted from the section heading, so without one"
            echo "the published notes fall back to a placeholder."
            echo "Please add a '## [$TAG_VERSION]' section to CHANGELOG.md before releasing!"
            exit 1
          fi
        shell: bash

      # Early, cheap half of the #1165 guard: structural corruption in
      # CHANGELOG.md, plus the citations in this version's section. Fails here
      # rather than 20 minutes later in enhanced-release.yml, after the builds.
      # The authoritative gate is still the release-body check in
      # enhanced-release.yml -- this one runs against the FILE, that one runs
      # against the bytes that get published.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Release notes guard (structure + citations)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          python scripts/check_release_notes.py --changelog-structure
          python scripts/check_release_notes.py --version "$TAG_VERSION"
        shell: bash

      - name: Check version in project.godot
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Checking project.godot version..."

          if grep -q "config/version=\"$TAG_VERSION\"" godot/project.godot; then
            echo "SUCCESS project.godot version matches tag"
          else
            echo "ERROR WARNING: project.godot version does not match tag v$TAG_VERSION"
            exit 1
          fi
        shell: bash

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR ERROR: Uncommitted changes found!"
            git status
            exit 1
          else
            echo "SUCCESS No uncommitted changes"
          fi

      - name: Post validation results
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.ref.replace('refs/tags/', '');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `WARNING Pre-Release Checks Failed: ${tagName}`,
              body: `## Pre-release validation failed for ${tagName}\n\nPlease check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.\n\n**Common issues:**\n- CHANGELOG.md not updated\n- Version mismatch in project.godot\n- Tests failing\n- Uncommitted changes\n\nFix these issues and re-tag the release.`,
              labels: ['release', 'build-failed']
            });
