name: Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Python syntax gate (3.11 baseline)
      run: |
        echo "Compiling automation Python (scripts, tools, tests, docs/shared) on the Python 3.11 baseline..."
        echo "(Guards against modern-only syntax, e.g. PEP 701 f-strings, landing in CI automation.)"
        files=$(find scripts tools tests docs/shared -name '*.py' -not -path '*/archive/*' -not -path '*/legacy/*')
        echo "Files to compile: $(echo "$files" | wc -l)"
        python -m py_compile $files
        echo "SUCCESS All automation Python compiles on the declared baseline"

    - name: ASCII Compliance Check
      run: |
        echo "Checking ASCII compliance with intelligent converter..."
        python scripts/intelligent_ascii_converter.py --dry-run
        if [ $? -ne 0 ]; then
          echo "ASCII compliance violations found!"
          echo "Run: python scripts/intelligent_ascii_converter.py --apply to fix"
          exit 1
        fi

    - name: Development Standards Check
      run: |
        echo "Running comprehensive standards enforcement..."
        python scripts/enforce_standards.py --check-all || echo "WARNING  Standards check warnings (non-blocking during Godot migration)"

    - name: Scene Navigation Chokepoint Check
      run: |
        echo "Enforcing: all scene navigation routes through SceneTransition (deferred swap)."
        echo "(Guards the v0.11.0 release-only crash: change_scene_to_file() from inside _input()."
        echo " See docs/LEADERBOARD_CRASH_DIAGNOSIS.md.)"
        python tools/check_scene_nav.py

    - name: Import Cleanup Check
      run: |
        echo "INFO  Project migrated to Godot - Python import checks skipped"
        echo "SUCCESS GDScript doesn't have unused import issues"

    - name: Version Consistency Check
      run: |
        echo "Checking version.txt + ladder_version.txt (SSOTs) are stamped into every derived copy..."
        echo "(game_config.gd / project.godot / export_presets.cfg / welcome.tscn."
        echo " A silent drift forks the leaderboard board-key, so this gate is FATAL.)"
        python tools/sync_version.py --check

    - name: Ladder Bump Check (blocking, ack-able)
      if: github.event_name == 'pull_request'
      env:
        # SECURITY: all three are user-influenced -- pass via env, never inline in run
        BASE_REF: ${{ github.base_ref }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      run: |
        echo "Build-vs-ladder split: fail when gameplay-surface files changed without a"
        echo "ladder_version.txt bump (or vice versa) AND nobody acked it in writing."
        echo "(Board key is (seed, ladder_version). A silent ladder move writes scores to a"
        echo " board built under different rules -- issue #1178. This step ran with '|| true'"
        echo " until 2026-08-09, so it could not fail; it missed the #1137 bump for 31 hours.)"
        echo "Ack by putting 'ladder-ack: <reason>' in the PR body, or applying 'ladder-ack'."
        git fetch origin "$BASE_REF" --depth=1
        case ",$PR_LABELS," in
          *,ladder-ack,*) LADDER_ACK="ladder-ack: the 'ladder-ack' label is applied to this PR" ;;
          *)              LADDER_ACK="$PR_BODY" ;;
        esac
        export LADDER_ACK
        python tools/check_ladder_bump.py --base "origin/$BASE_REF" --strict

    - name: Web Export System Check
      run: |
        echo "INFO  Project migrated to Godot - Python web export checks skipped"
        echo "SUCCESS Web export handled by Godot export system"

    - name: CLI Interface Check
      run: |
        echo "INFO  Project migrated to Godot - Python CLI checks skipped"
        echo "SUCCESS Game runs via Godot engine"

    - name: Documentation Check
      run: |
        echo "Checking documentation structure..."
        required_docs=(
          "README.md"
          "CHANGELOG.md"
        )

        for doc in "${required_docs[@]}"; do
          if [ ! -f "$doc" ]; then
            echo "ERROR: Required documentation missing: $doc"
            exit 1
          fi
        done

        echo "Documentation structure validated"

    - name: Commit Message Check
      if: github.event_name == 'pull_request'
      run: |
        echo "Checking latest commit message for ASCII compliance..."
        commit_msg=$(git log -1 --pretty=%B)
        echo "Commit message: $commit_msg"

        # Check for common Unicode violations
        if echo "$commit_msg" | grep -P '[^\x00-\x7F]'; then
          echo "ERROR: Non-ASCII characters found in commit message"
          echo "Use ASCII-only characters in commit messages"
          exit 1
        fi

        echo "Commit message ASCII compliance verified"

    - name: Health Gate Check
      run: |
        echo "Running project health assessment..."

        # Run comprehensive health check
        python scripts/project_health.py --quick-check

        # Run health gate for CI/CD (non-blocking during Godot migration)
        python scripts/ci_health_integration.py --gate-check || echo "WARNING  Health gate warnings (non-blocking during migration - linting issues in legacy Python files)"

        echo "Project health assessment: COMPLETED"
