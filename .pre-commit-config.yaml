# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # .ics is excluded from all three whitespace/EOL hooks: RFC 5545 3.1
      # mandates CRLF and folds long lines with a leading space, so "fixing" it
      # produces a file a strict calendar client rejects. See .gitattributes.
      - id: trailing-whitespace
        exclude: '\.ics$'
      - id: end-of-file-fixer
        exclude: '\.ics$'
      - id: check-yaml
        args: ['--allow-multiple-documents', '--unsafe']
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
        # Music tracks are legitimately >1MB; committed game/tool audio is
        # deliberate (storage-is-cheap policy). Guard stays for everything else.
        exclude: '^(godot/assets/audio/|tools/music/captures/game/).*\.(ogg|mp3|wav)$'
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: '\.ics$'

  # Python formatting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=100']

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']

  # Python linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.15
    hooks:
      - id: ruff
        args: ['--fix']

  # Custom project-specific checks
  - repo: local
    hooks:
      - id: enforce-standards
        name: Enforce Project Standards (incremental)
        entry: python scripts/enforce_standards.py --incremental
        language: system
        files: '\.(py|md|txt|json|ya?ml|toml|cfg|ini|sh)$'
        pass_filenames: true
        # Fast, changed-files-only ASCII + syntax check. The exhaustive whole-tree scan
        # (enforce_standards.py --check-all) runs in CI (quality-checks.yml), not on every
        # local commit -- see docs discussion of the fast-local / thorough-CI split.

      - id: no-emoji
        name: No emoji / ASCII enforcement (godot tree, issue #744)
        entry: python scripts/check_no_emoji.py
        language: system
        pass_filenames: false

      - id: check-pyc-files
        name: Check for .pyc files
        entry: python -c "import sys; sys.exit(1 if any('.pyc' in arg for arg in sys.argv[1:]) else 0)"
        language: system
        pass_filenames: true

      - id: check-pygame-dir
        name: Ensure pygame/ directory is not added
        entry: python -c "import sys; sys.exit(1 if any('pygame/' in arg for arg in sys.argv[1:]) else 0)"
        language: system
        pass_filenames: true

      - id: style-guide-reminder
        name: Style Guide Update Reminder
        entry: python scripts/check_style_guide.py
        language: system
        pass_filenames: false
        verbose: true

      - id: dq-index-check
        name: DQ index up to date
        entry: python scripts/generate_dq_index.py --check
        language: system
        files: 'docs/game-design/(WORKSHOP_2_BACKLOG|DQ_INDEX)\.md'
        pass_filenames: false

      - id: adr-index-check
        name: ADR index up to date
        entry: python scripts/generate_adr_index.py --check
        language: system
        files: 'docs/game-design/decisions/.*\.md'
        pass_filenames: false

      # Dev-tools index is GENERATED (same anti-rot pattern as the DQ/ADR indexes).
      # Fires when any tool, any caller-scan source, or the index itself changes,
      # because the index derives from ALL of those.
      - id: tools-index-check
        name: dev tools index up to date
        entry: python scripts/generate_tools_index.py --check
        language: system
        files: '^(scripts/.*\.py|tools/.*\.py|tests/test_.*\.py|docs/TOOLS\.md|\.pre-commit-config\.yaml|Makefile|\.github/workflows/.*\.ya?ml)$'
        pass_filenames: false

      # Action taxonomy index is GENERATED (same anti-rot pattern again). NOTE THE
      # FLAG: --check-stale gates the INDEX only. The full --check also fails on
      # taxonomy VIOLATIONS, and is deliberately NOT wired while `take_loan` is
      # defined in two files -- a gate that is red on arrival gets disabled inside a
      # week (#1117: a Python lane here already ran as `|| echo` over zero
      # assertions). Flip this entry to `--check` when the error list is empty; a
      # test in tests/test_generate_action_taxonomy.py fails when that day comes.
      - id: action-taxonomy-index-check
        name: action taxonomy index up to date
        entry: python scripts/generate_action_taxonomy.py --check-stale
        language: system
        files: '^(godot/data/actions/.*\.json|godot/scripts/ui/(action_bar_renderer|submenu_controller)\.gd|docs/ACTION_TAXONOMY\.md|scripts/generate_action_taxonomy\.py)$'
        pass_filenames: false

      # godot/data/credits.json is GENERATED from CREDITS.md (same anti-rot pattern
      # as the DQ/ADR/tools indexes). CREDITS.md is where a name gets fixed; this
      # blocks the commit where someone edits it and forgets the game copy, which is
      # exactly how a contributor ends up credited in the repo and not in the product.
      - id: credits-json-check
        name: in-game credits.json regenerated from CREDITS.md
        entry: python scripts/generate_credits.py --check
        language: system
        files: '^(CREDITS\.md|godot/data/credits\.json|scripts/generate_credits\.py)$'
        pass_filenames: false

      # The commitment calendar is GENERATED (same anti-rot pattern as the DQ/ADR/
      # tools indexes). It fires on the files the calendar DERIVES from -- every
      # doc, the roadmap, the GitHub snapshot and the generator -- because a
      # COMMITMENT: declaration can be written anywhere, and a hook scoped to
      # docs/calendar/ would miss the one place it matters: someone adding a dated
      # promise to the document where the promise belongs.
      # Offline and deterministic by construction: the prose scan is bounded by the
      # pinned CALENDAR-HORIZON, not by the clock, so this cannot go red overnight
      # without a human edit.
      - id: commitment-calendar-check
        name: commitment calendar (.ics + index) up to date
        entry: python scripts/generate_commitment_calendar.py --check
        language: system
        files: '^(docs/.*\.md|docs/calendar/github_snapshot\.json|scripts/generate_commitment_calendar\.py|tools/.*\.py|scripts/.*\.py|[^/]*\.md)$'
        pass_filenames: false

      - id: scene-nav-check
        name: Scene navigation routes through SceneTransition
        entry: python tools/check_scene_nav.py
        language: system
        files: '\.gd$'
        pass_filenames: true

      - id: version-sync-check
        name: version.txt + ladder_version.txt synced to derived copies
        entry: python tools/sync_version.py --check
        language: system
        files: '(version\.txt|ladder_version\.txt|godot/autoload/game_config\.gd|godot/project\.godot|godot/export_presets\.cfg|godot/scenes/welcome\.tscn)$'
        pass_filenames: false

      # Release feed index is GENERATED, never hand-maintained (#1008). Same anti-rot
      # pattern as the DQ index. Scoped to the feed itself, so it only fires when someone
      # touches those files -- a full-tree gate would block every commit after a tag until
      # the index was regenerated.
      # Cheapest third of the #1165 guard: structural corruption only (duplicate
      # [Unreleased] headings), offline, no gh call, no network. The checks that
      # actually matter -- open-issue citations and commit ties -- run at RELEASE
      # time in enhanced-release.yml, because the false claim reaches players
      # through the release body, not through this file.
      - id: changelog-structure-check
        name: CHANGELOG.md has exactly one [Unreleased] heading
        entry: python scripts/check_release_notes.py --changelog-structure --offline
        language: system
        files: '^CHANGELOG\.md$'
        pass_filenames: false

      - id: release-index-check
        name: release feed index matches the git tags
        entry: python scripts/generate_release_metadata.py --check
        language: system
        files: '^public/releases/.*\.(json|rss)$'
        pass_filenames: false

# Configuration
default_language_version:
  python: python3

# Skip some hooks for certain files
exclude: |
  (?x)^(
      archive/.*|
      archived/.*|
      legacy/.*|
      docs/archive/.*|
      \.git/.*|
      \.mypy_cache/.*|
      \.pytest_cache/.*
  )$
