schema_version: '1.0'
_meta: 'Core resource icon set (issue #900, round 2). Replaces the 7 theme_manager.gd
  placeholders (logo, icon_money, icon_compute, icon_research, icon_doom, icon_paper,
  icon_reputation -- theme_manager.gd:112-118). Reuses the quirk-icon prompt formula
  (art_prompts/quirk_icons.yaml: global_icon_base + surface_tarkov) that Pip called
  fresher and bolder. Colour language from godot/autoload/theme_manager.gd: money
  -> funding cyan-teal (#4DCCB3), compute -> resources blue (#8080CC), research ->
  purple (#B380E6), doom -> crimson red (#E64D33 toward doom_critical #B31A1A), paper
  -> neutral parchment (no saturated accent), reputation -> gold (#E6B34D), logo ->
  doom crimson with amber ember. Promoted 64px files would land in godot/assets/icons/;
  NO wiring in this round -- triage first.'
asset_type: core_resource_icons
default_size: 1024x1024
output_sizes:
- 1024
- 512
- 256
- 128
- 64
background: opaque
styles:
  global_icon_base: 'high-res 1024x1024 square game icon, single central symbol, soft
    but detailed digital painting with slightly cartoony shapes, StarCraft 2 / early-2000s
    XCOM ability icon feel, plain or softly graded background with a subtle vignette,
    no full scene or environment, no text, strong chunky silhouette that reads clearly
    at 64x64, limited color palette, high contrast lighting, centered composition

    '
  surface_tarkov: Tarkov-style worn metal and dirty surfaces but simplified
themes:
  resource_money:
    style_overrides:
    - global_icon_base
    - surface_tarkov
    color_bias: resource colour MONEY -- the single saturated accent is a cool cyan-teal
      glow (#4DCCB3 family, the funding colour), dark desaturated grey-slate ground,
      no other saturated hue
  resource_compute:
    style_overrides:
    - global_icon_base
    - surface_tarkov
    color_bias: resource colour COMPUTE -- the single saturated accent is an electric
      blue-violet glow (#8080CC family, the infrastructure colour), dark desaturated
      gunmetal ground, no other saturated hue
  resource_research:
    style_overrides:
    - global_icon_base
    - surface_tarkov
    color_bias: resource colour RESEARCH -- the single saturated accent is a bright
      violet purple glow (#B380E6 family, the science colour), dark desaturated aubergine-grey
      ground, no other saturated hue
  resource_doom:
    style_overrides:
    - global_icon_base
    - surface_tarkov
    color_bias: 'resource colour DOOM -- the single saturated accent is an ominous
      crimson red glow (#E64D33 toward deep #B31A1A), dark desaturated grey-brown
      ground, no other saturated hue'
  resource_paper:
    style_overrides:
    - global_icon_base
    - surface_tarkov
    color_bias: resource colour PAPERS -- desaturated warm parchment off-white and
      grey-teal tones, dim soft highlight, NO strongly saturated accent colour
  resource_reputation:
    style_overrides:
    - global_icon_base
    - surface_tarkov
    color_bias: resource colour REPUTATION -- the single saturated accent is a warm
      gold-amber glow (#E6B34D family, the leadership colour), dark desaturated grey-brown
      ground, no other saturated hue
  brand_logo:
    style_overrides:
    - global_icon_base
    - surface_tarkov
    color_bias: brand emblem -- ominous crimson red core glow (#B31A1A family) with
      a single warm amber ember accent, near-black charcoal ground, no other saturated
      hue
