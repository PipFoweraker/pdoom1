schema_version: '1.0'
_meta: 'Quirk icon set for the employee surfaces (issue #903). 14 quirk icons (ids
  match godot/data/researchers/quirks.json exactly) + 2 state glyphs (quirk_unrevealed,
  quirk_none). Valence colour language taken from godot/autoload/theme_manager.gd:
  positive -> green (theme "success" #33CC4D, same family as the employee_status_active
  check), negative -> crimson red (theme "error" #E64D33 toward "doom_critical" #B31A1A),
  double_edged -> violet purple (theme "category_research" #B380E6, the step-above-red
  doom purple family), state glyphs -> desaturated grey-teal neutral. Lock-base +
  colour-via-effects pattern (SEED_ART_DIRECTION section 2): one base circular indicator
  treatment reused from the employee_status family in ui_icons.yaml; ONLY the accent
  hue tells valence. Promoted 64px files land in godot/assets/icons/quirks/<id>_64.png.'
asset_type: quirk_icons
default_size: 1024x1024
output_sizes:
- 1024
- 512
- 256
- 128
- 64
background: opaque
styles:
  global_icon_base: 'high-res 1024x1024 square game icon, single central symbol, soft
    but detailed digital painting with slightly cartoony shapes, StarCraft 2 / early-2000s
    XCOM ability icon feel, plain or softly graded background with a subtle vignette,
    no full scene or environment, no text, strong chunky silhouette that reads clearly
    at 64x64, limited color palette, high contrast lighting, centered composition

    '
  surface_tarkov: Tarkov-style worn metal and dirty surfaces but simplified
themes:
  valence_positive:
    style_overrides:
    - global_icon_base
    - surface_tarkov
    color_bias: valence colour POSITIVE -- the single saturated accent is a healthy
      green glow (#33CC4D family), dark desaturated teal-grey ground, no other saturated
      hue
  valence_negative:
    style_overrides:
    - global_icon_base
    - surface_tarkov
    color_bias: 'valence colour NEGATIVE -- the single saturated accent is an ominous
      crimson red glow (#E64D33 toward deep #B31A1A), dark desaturated grey-brown
      ground, no other saturated hue'
  valence_double_edged:
    style_overrides:
    - global_icon_base
    - surface_tarkov
    color_bias: valence colour DOUBLE-EDGED -- the single saturated accent is a violet
      purple glow (#B380E6 family), dark desaturated aubergine-grey ground, no other
      saturated hue
  valence_neutral:
    style_overrides:
    - global_icon_base
    - surface_tarkov
    color_bias: neutral state glyph -- desaturated grey-teal tones only, dim off-white
      highlight, NO saturated accent colour
